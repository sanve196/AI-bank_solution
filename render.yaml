services:
  - type: web
    name: ai-bank-solution
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-bank-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: ai-bank-db
    plan: free
    databaseName: ai_bank
    user: ai_bank
